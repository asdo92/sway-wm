# List of plugins
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Run theme and set flavor
set -g @catppuccin_window_text ' #{window_name}'
set -g @catppuccin_window_default_text ' #{window_name}'
set -g @catppuccin_window_current_text ' #{window_name}'
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha

# Options to make tmux more pleasant
set -g window-status-format ' #I:#{window_name}'
set -g window-status-current-format ' #[bold]#I:#{window_name}'
set -g mouse on
set -g default-terminal "tmux-256color"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux

# Set status bar top
set-option -g status-position top

# Set keybinds
bind-key -n C-M-c new-window
bind-key -n C-M-x kill-window
bind-key -n C-M-n next-window
bind-key -n C-M-0 select-window -t :0
bind-key -n C-M-1 select-window -t :1
bind-key -n C-M-2 select-window -t :2
bind-key -n C-M-3 select-window -t :3
bind-key -n C-M-4 select-window -t :4
bind-key -n C-M-5 select-window -t :5
bind-key -n C-M-6 select-window -t :6
bind-key -n C-M-7 select-window -t :7
bind-key -n C-M-8 select-window -t :8
bind-key -n C-M-9 select-window -t :9
bind-key -n C-M-q confirm-before -p " ¿Close tmux? (y/n)" "kill-server"
bind-key -n C-M-s confirm-before -p " ¿Kill session? (y/n)" "kill-session"
bind-key -n C-M-v split-window -h
bind-key -n C-M-h split-window -v
bind-key -n C-M-o select-pane -t :.+
bind-key -n C-M-z resize-pane -Z
bind-key -n C-M-k kill-pane
bind-key -n C-M-r source-file ~/.tmux.conf
bind-key -n C-M-w command-prompt -p "New name:" "rename-window '%%'"
bind-key -n C-M-Left  resize-pane -L 5
bind-key -n C-M-Right resize-pane -R 5
bind-key -n C-M-Up    resize-pane -U 3
bind-key -n C-M-Down  resize-pane -D 3

set -g base-index 0
set -g pane-base-index 0

# Rename windows
set -g automatic-rename off
set -g allow-rename off
